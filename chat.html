<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant PeerJS File Share</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f8f9fa; color: #333; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px 0; display: block; width: 100%; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 14px; font-weight: bold; background: #fee2e2; color: #991b1b; }
        .connected { background: #dcfce7; color: #166534; }
        .peer-id-display { font-family: monospace; font-size: 18px; font-weight: bold; color: #007bff; display: inline-block; padding: 4px 8px; background: #e6f2ff; border-radius: 4px; }
        progress { width: 100%; height: 20px; margin-top: 10px; }
        #download-link { display: block; text-align: center; margin-top: 15px; background: #22c55e; color: white; padding: 12px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>⚡ PeerJS Automated File Share</h2>
    <p>Hosted via GitHub Pages. Real-time P2P file transfers without manual copying.</p>
    
    <div class="box">
        Network Status: <span id="status" class="status-badge">Initializing...</span>
        <div style="margin-top: 10px;">
            Your Share ID: <span id="my-id" class="peer-id-display">Generating...</span>
        </div>
    </div>

    <div class="box" id="connection-setup">
        <h3>Connect to a Peer</h3>
        <input type="text" id="remote-id" placeholder="Enter Friend's Share ID...">
        <button id="connect-btn">Connect & Link Devices</button>
    </div>

    <div class="box" id="transfer-section" style="display: none;">
        <h3>Share Files</h3>
        <input type="file" id="file-input">
        <button id="send-file-btn">Send File</button>
        
        <div id="progress-container" style="display: none; margin-top: 15px;">
            <p id="progress-text">Transferring: 0%</p>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>

        <div id="incoming-file-box"></div>
    </div>

    <script>
        // Initialize PeerJS and auto-connect to their free public signaling cloud
        const peer = new Peer();
        let conn = null;

        // File Assembly Storage
        let receivedChunks = [];
        let expectedSize = 0;
        let receivedSize = 0;
        let incomingFileName = '';
        const CHUNK_SIZE = 16384; // 16KB optimization standard for WebRTC buffers

        const el = id => document.getElementById(id);

        // --- 1. GENERATE UNIQUE ID ---
        peer.on('open', (id) => {
            el('my-id').textContent = id;
            el('status').textContent = "Ready";
            el('status').className = "status-badge";
            el('status').style.background = "#fef08a";
            el('status').style.color = "#854d0e";
        });

        // --- 2. OUTBOUND CONNECTION (You input an ID and click connect) ---
        el('connect-btn').onclick = () => {
            const remoteId = el('remote-id').value.trim();
            if (!remoteId) return alert("Please enter a valid Share ID.");

            el('status').textContent = "Connecting...";
            
            // Connect to remote peer
            conn = peer.connect(remoteId, { label: 'file-transfer', reliable: true });
            setupConnectionHandlers();
        };

        // --- 3. INBOUND CONNECTION (Someone else enters your ID) ---
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            setupConnectionHandlers();
        });

        // --- 4. WEBRTC DATA PIPE HANDLERS ---
        function setupConnectionHandlers() {
            conn.on('open', () => {
                el('status').textContent = "Connected!";
                el('status').className = "status-badge connected";
                el('connection-setup').style.display = "none";
                el('transfer-section').style.display = "block";
            });

            conn.on('data', handleIncomingData);

            conn.on('close', () => {
                alert("Connection lost.");
                location.reload();
            });
        }

        // --- 5. SENDING CHUNKED DATA ---
        el('send-file-btn').onclick = async () => {
            const file = el('file-input').files[0];
            if (!file) return alert("Select a file first!");

            el('progress-container').style.display = 'block';
            
            // Notify receiver of incoming file specifications
            conn.send(JSON.stringify({ name: file.name, size: file.size }));

            const reader = file.stream().getReader();
            let offset = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                let chunkOffset = 0;
                while (chunkOffset < value.length) {
                    // Prevent memory-flooding browser outbound buffers
                    if (conn.dataChannel.bufferedAmount > 16000000) { 
                        await new Promise(r => setTimeout(r, 50));
                        continue;
                    }

                    const chunk = value.slice(chunkOffset, chunkOffset + CHUNK_SIZE);
                    conn.send(chunk);
                    
                    chunkOffset += CHUNK_SIZE;
                    offset += chunk.length;

                    const percent = Math.round((offset / file.size) * 100);
                    el('progress-bar').value = percent;
                    el('progress-text').textContent = `Sending: ${percent}%`;
                }
            }
            el('progress-text').textContent = "Sent successfully!";
        };

        // --- 6. RECEIVING & CONCATENATING DATA ---
        function handleIncomingData(data) {
            // Check if packet is text (metadata) or array buffer (raw file segment)
            if (typeof data === 'string') {
                const metadata = JSON.parse(data);
                incomingFileName = metadata.name;
                expectedSize = metadata.size;
                receivedSize = 0;
                receivedChunks = [];
                
                el('progress-container').style.display = 'block';
                el('progress-text').textContent = `Incoming: ${incomingFileName}...`;
                return;
            }

            // Append chunk
            receivedChunks.push(data);
            receivedSize += data.byteLength;

            const percent = Math.round((receivedSize / expectedSize) * 100);
            el('progress-bar').value = percent;
            el('progress-text').textContent = `Receiving: ${percent}%`;

            if (receivedSize >= expectedSize) {
                el('progress-text').textContent = "Download Complete!";
                
                const receivedBlob = new Blob(receivedChunks);
                const downloadUrl = URL.createObjectURL(receivedBlob);
                
                el('incoming-file-box').innerHTML = `
                    <p>🎉 New File Received:</p>
                    <a id="download-link" href="${downloadUrl}" download="${incomingFileName}">💾 Save ${incomingFileName}</a>
                `;
            }
        }
    </script>
</body>
</html>
