<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Diff Comparator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }

  header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 600; color: #58a6ff; }

  .toolbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d; cursor: pointer; font-size: 13px; font-weight: 500; background: #21262d; color: #e6edf3; transition: background 0.15s; }
  .btn:hover { background: #30363d; }
  .btn.primary { background: #238636; border-color: #238636; color: #fff; }
  .btn.primary:hover { background: #2ea043; }
  .btn.danger { background: #21262d; border-color: #f85149; color: #f85149; }
  .btn.danger:hover { background: #3d1a1a; }

  .editors { display: flex; flex: 1; overflow: hidden; }
  .pane { display: flex; flex-direction: column; flex: 1; border-right: 1px solid #30363d; overflow: hidden; }
  .pane:last-child { border-right: none; }

  .pane-header { background: #161b22; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #30363d; flex-shrink: 0; }
  .pane-label { font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .filename-input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 4px 8px; border-radius: 5px; font-size: 13px; }
  .filename-input:focus { outline: none; border-color: #58a6ff; }
  .dl-btn { padding: 4px 10px; font-size: 12px; background: #21262d; border: 1px solid #30363d; color: #58a6ff; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .dl-btn:hover { background: #30363d; }

  textarea { flex: 1; background: #0d1117; color: #e6edf3; border: none; resize: none; padding: 12px; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; outline: none; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
  textarea::placeholder { color: #484f58; }

  .diff-view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .diff-view.active { display: flex; }
  .editors.hidden { display: none; }

  .diff-header { background: #161b22; padding: 8px 20px; border-bottom: 1px solid #30363d; font-size: 12px; color: #8b949e; flex-shrink: 0; display: flex; gap: 20px; }
  .legend { display: flex; gap: 12px; align-items: center; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .leg-box { width: 12px; height: 12px; border-radius: 2px; }
  .leg-add { background: #1a3a2a; border: 1px solid #238636; }
  .leg-del { background: #3a1a1a; border: 1px solid #f85149; }
  .leg-mod { background: #2a2a1a; border: 1px solid #d29922; }

  .diff-content { display: flex; flex: 1; overflow: hidden; }
  .diff-pane { flex: 1; overflow: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; border-right: 1px solid #30363d; }
  .diff-pane:last-child { border-right: none; }
  .diff-pane-title { background: #161b22; padding: 4px 12px; font-size: 11px; color: #8b949e; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 1; }
  .diff-line { display: flex; min-width: max-content; }
  .line-num { min-width: 40px; padding: 0 8px; color: #484f58; text-align: right; user-select: none; border-right: 1px solid #21262d; flex-shrink: 0; font-size: 11px; line-height: 1.6; }
  .line-content { padding: 0 12px; white-space: pre; }
  .line-add { background: #1a3a2a; }
  .line-del { background: #3a1a1a; }
  .line-mod { background: #2a2a1a; }
  .line-empty { background: #0d1117; color: transparent; }

  .stats { font-size: 12px; color: #8b949e; margin-left: auto; }
  .stat-add { color: #3fb950; }
  .stat-del { color: #f85149; }
</style>
</head>
<body>

<header>
  <h1>⚡ Text Diff Comparator</h1>
  <span style="font-size:12px;color:#484f58;">Auto-saves to localStorage</span>
</header>

<div class="toolbar">
  <button class="btn primary" onclick="runDiff()">⚡ Compare</button>
  <button class="btn" onclick="showEditors()">✏️ Edit</button>
  <button class="btn danger" onclick="clearAll()">🗑 Clear All</button>
  <span id="diffStats" class="stats"></span>
</div>

<div class="editors" id="editorsView">
  <div class="pane">
    <div class="pane-header">
      <span class="pane-label">File A</span>
      <input class="filename-input" id="nameA" type="text" placeholder="filename-a.txt" />
      <button class="dl-btn" onclick="download('A')">⬇ Download</button>
    </div>
    <textarea id="textA" placeholder="Paste content A here..." oninput="save()"></textarea>
  </div>
  <div class="pane">
    <div class="pane-header">
      <span class="pane-label">File B</span>
      <input class="filename-input" id="nameB" type="text" placeholder="filename-b.txt" />
      <button class="dl-btn" onclick="download('B')">⬇ Download</button>
    </div>
    <textarea id="textB" placeholder="Paste content B here..." oninput="save()"></textarea>
  </div>
</div>

<div class="diff-view" id="diffView">
  <div class="diff-header">
    <div class="legend">
      <div class="leg"><div class="leg-box leg-add"></div> Added</div>
      <div class="leg"><div class="leg-box leg-del"></div> Removed</div>
      <div class="leg"><div class="leg-box leg-mod"></div> Modified</div>
    </div>
  </div>
  <div class="diff-content">
    <div class="diff-pane" id="diffLeft">
      <div class="diff-pane-title" id="titleA">File A</div>
    </div>
    <div class="diff-pane" id="diffRight">
      <div class="diff-pane-title" id="titleB">File B</div>
    </div>
  </div>
</div>

<script>
  // ── Load from localStorage ──────────────────────────────────────────────
  function load() {
    const ta = localStorage.getItem('diffTextA');
    const tb = localStorage.getItem('diffTextB');
    const na = localStorage.getItem('diffNameA');
    const nb = localStorage.getItem('diffNameB');
    if (ta) document.getElementById('textA').value = ta;
    if (tb) document.getElementById('textB').value = tb;
    if (na) document.getElementById('nameA').value = na;
    if (nb) document.getElementById('nameB').value = nb;
  }

  function save() {
    localStorage.setItem('diffTextA', document.getElementById('textA').value);
    localStorage.setItem('diffTextB', document.getElementById('textB').value);
    localStorage.setItem('diffNameA', document.getElementById('nameA').value);
    localStorage.setItem('diffNameB', document.getElementById('nameB').value);
  }

  document.getElementById('nameA').addEventListener('input', save);
  document.getElementById('nameB').addEventListener('input', save);

  // ── Download ────────────────────────────────────────────────────────────
  function download(side) {
    const text = document.getElementById('text' + side).value;
    const name = document.getElementById('name' + side).value.trim() || ('file-' + side.toLowerCase() + '.txt');
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ── Clear ───────────────────────────────────────────────────────────────
  function clearAll() {
    if (!confirm('Clear all content and filenames?')) return;
    ['textA','textB','nameA','nameB'].forEach(id => document.getElementById(id).value = '');
    localStorage.clear();
    showEditors();
    document.getElementById('diffStats').textContent = '';
  }

  // ── View switching ──────────────────────────────────────────────────────
  function showEditors() {
    document.getElementById('editorsView').classList.remove('hidden');
    document.getElementById('diffView').classList.remove('active');
  }

  function showDiff() {
    document.getElementById('editorsView').classList.add('hidden');
    document.getElementById('diffView').classList.add('active');
  }

  // ── LCS-based Diff ──────────────────────────────────────────────────────
  function lcs(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({length: m+1}, () => new Uint16Array(n+1));
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    // backtrack
    const ops = [];
    let i = m, j = n;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && a[i-1] === b[j-1]) { ops.push({type:'eq', a:a[i-1], b:b[j-1]}); i--; j--; }
      else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) { ops.push({type:'ins', b:b[j-1]}); j--; }
      else { ops.push({type:'del', a:a[i-1]}); i--; }
    }
    return ops.reverse();
  }

  function runDiff() {
    const rawA = document.getElementById('textA').value;
    const rawB = document.getElementById('textB').value;
    const linesA = rawA.split('\n');
    const linesB = rawB.split('\n');
    const nameA = document.getElementById('nameA').value.trim() || 'File A';
    const nameB = document.getElementById('nameB').value.trim() || 'File B';

    document.getElementById('titleA').textContent = nameA;
    document.getElementById('titleB').textContent = nameB;

    const ops = lcs(linesA, linesB);

    // pair up deletions+insertions as modifications
    const paired = [];
    let k = 0;
    while (k < ops.length) {
      if (ops[k].type === 'del' && k+1 < ops.length && ops[k+1].type === 'ins') {
        paired.push({type:'mod', a:ops[k].a, b:ops[k+1].b});
        k += 2;
      } else { paired.push(ops[k]); k++; }
    }

    let leftHTML = '', rightHTML = '';
    let numA = 0, numB = 0;
    let adds = 0, dels = 0, mods = 0;

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function leftLine(cls, n, text) {
      return `<div class="diff-line ${cls}"><span class="line-num">${n}</span><span class="line-content">${esc(text)}</span></div>`;
    }
    function rightLine(cls, n, text) {
      return `<div class="diff-line ${cls}"><span class="line-num">${n}</span><span class="line-content">${esc(text)}</span></div>`;
    }
    function emptyLine() {
      return `<div class="diff-line line-empty"><span class="line-num"> </span><span class="line-content"> </span></div>`;
    }

    for (const op of paired) {
      if (op.type === 'eq') {
        numA++; numB++;
        leftHTML  += leftLine('', numA, op.a);
        rightHTML += rightLine('', numB, op.b);
      } else if (op.type === 'del') {
        numA++; dels++;
        leftHTML  += leftLine('line-del', numA, op.a);
        rightHTML += emptyLine();
      } else if (op.type === 'ins') {
        numB++; adds++;
        leftHTML  += emptyLine();
        rightHTML += rightLine('line-add', numB, op.b);
      } else if (op.type === 'mod') {
        numA++; numB++; mods++;
        leftHTML  += leftLine('line-mod', numA, op.a);
        rightHTML += rightLine('line-mod', numB, op.b);
      }
    }

    const leftPane  = document.getElementById('diffLeft');
    const rightPane = document.getElementById('diffRight');
    const titleA = `<div class="diff-pane-title" id="titleA">${esc(nameA)}</div>`;
    const titleB = `<div class="diff-pane-title" id="titleB">${esc(nameB)}</div>`;
    leftPane.innerHTML  = titleA + leftHTML;
    rightPane.innerHTML = titleB + rightHTML;

    // sync scroll
    leftPane.onscroll  = () => rightPane.scrollTop = leftPane.scrollTop;
    rightPane.onscroll = () => leftPane.scrollTop  = rightPane.scrollTop;

    document.getElementById('diffStats').innerHTML =
      `<span class="stat-add">+${adds} added</span> &nbsp; <span class="stat-del">−${dels} removed</span> &nbsp; ~${mods} modified`;

    showDiff();
  }

  load();
</script>
</body>
</html>
