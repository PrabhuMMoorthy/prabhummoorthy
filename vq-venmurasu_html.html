<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venmurasu — Quotes</title>
<link rel="stylesheet" href="vq-style.css">
</head>
<body data-theme="dark">

<header>
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()">
    <span></span><span></span><span></span>
  </button>
  <div>
    <div class="logo">வெண்முரசு</div>
    <div class="subtitle">Quote Reader</div>
  </div>
  <div class="header-right">
    <button class="utilities-btn" onclick="toggleRightSidebar()" title="Settings & Insights">
      ⚙️ Options
    </button>
  </div>
</header>

<div class="main-layout">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  
  <!-- Left Navigation Sidebar -->
  <div class="sidebar" id="sidebar" style="display:none">
    <div class="sidebar-tabs">
      <button class="tab-btn active" onclick="switchTab('books')" id="tab-books">📖 Books</button>
      <button class="tab-btn"        onclick="switchTab('chars')" id="tab-chars">👤 Chars</button>
      <button class="tab-btn"        onclick="switchTab('themes')" id="tab-themes">🏷 Themes</button>
      <button class="tab-btn"        onclick="switchTab('search')" id="tab-search">🔍 Search</button>
      <button class="tab-btn"        onclick="switchTab('random')" id="tab-random">🎲 Rand</button>
    </div>
    <div class="sidebar-body" id="sidebar-body"></div>
  </div>

  <!-- Right Options Sidebar -->
  <div class="right-sidebar" id="right-sidebar">
    <div class="right-sidebar-header">
      <h3>⚙️ Options</h3>
      <button class="close-right-btn" onclick="toggleRightSidebar()">×</button>
    </div>
    <div class="right-sidebar-body">
      <div class="section-label" style="margin-top:0;">UI Themes</div>
      <div class="theme-switcher-vertical">
        <div class="theme-option" onclick="setTheme('dark')">
          <div class="theme-dot" data-t="dark"></div>
          <span>Night Gold</span>
        </div>
        <div class="theme-option" onclick="setTheme('light')">
          <div class="theme-dot" data-t="light"></div>
          <span>Parchment</span>
        </div>
        <div class="theme-option" onclick="setTheme('ocean')">
          <div class="theme-dot" data-t="ocean"></div>
          <span>Ocean Depth</span>
        </div>
        <div class="theme-option" onclick="setTheme('rose')">
          <div class="theme-dot" data-t="rose"></div>
          <span>Rose Petal</span>
        </div>
        <div class="theme-option" onclick="setTheme('forest')">
          <div class="theme-dot" data-t="forest"></div>
          <span>Forest Moss</span>
        </div>
        <div class="theme-option" onclick="setTheme('slate')">
          <div class="theme-dot" data-t="slate"></div>
          <span>Slate Blue</span>
        </div>
      </div>
      
      <div class="section-label" style="margin-top:24px;">Library Metrics</div>
      <button class="sidebar-link-btn" onclick="triggerShowStats()">
        <span>📊</span> View Insights & Stats
      </button>
    </div>
  </div>

  <!-- Content Workspace Container -->
  <div class="content" id="content">
    <div class="upload-wrap">
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📖</div>
        <div class="upload-title">Load your quotes JSON</div>
        <div class="upload-sub">Click to select your quotes data file</div>
        <button class="upload-btn" onclick="event.stopPropagation();document.getElementById('fileInput').click()">Choose File</button>
        <input type="file" id="fileInput" accept=".json" onchange="loadFile(event)">
      </div>
    </div>
  </div>
</div>

<!-- Export Modal -->
<div class="modal-wrap" id="exportModal">
  <div class="modal">
    <h2>📸 Export Quote as Image</h2>
    <div class="canvas-preview-wrap" id="previewWrap">
      <canvas id="previewCanvas" width="540" height="540"></canvas>
    </div>
    <div class="export-theme-grid" id="exportThemeGrid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-export" onclick="doExport()">⬇ Download Image</button>
    </div>
  </div>
</div>

<canvas id="exportCanvas" style="display:none;"></canvas>

<script src="vq-state.js"></script>
<script src="vq-db.js"></script>
<script src="vq-canvas.js"></script>
<script src="vq-search.js"></script>
<script src="vq-ui.js"></script>
</body>
</html>
