<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Book Notes & Literary Analyzer</title>
<style>
  /* ── CSS VARIABLES & DESIGN SYSTEM ───────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f0e8; 
    --card: #fffdf7; 
    --accent: #7c5c3a; 
    --accent-light: #c9a97a;
    --text: #2c1f0e; 
    --muted: #7a6a55; 
    --quote-bg: #f0e9d8; 
    --moral-bg: #e8f0e0;
    --tag-bg: #e8ddd0; 
    --drawer-bg: #2c1f0e; 
    --drawer-text: #f5f0e8;
    --foreshadow-bg: #f0ece0; 
    --symbol-bg: #eee8d8; 
    --device-bg: #f5f0e8;
    --emotion-bg: #f0ede4; 
    --relation-bg: #ede8dc; 
    --location-bg: #eaf0e4;
    --keyword-bg: #e4ddd2; 
    --section-border: rgba(124,92,58,0.13);
    --input-bg: #fffdf7;
    --input-border: #c9a97a;
  }
  body { 
    font-family: Georgia, serif; 
    background: var(--bg); 
    color: var(--text); 
    min-height: 100vh; 
    overflow-x: hidden; 
    transition: background 0.3s, color 0.3s; 
  }
  body.night {
    --bg: #0e0b07; 
    --card: #141008; 
    --accent: #a07848; 
    --accent-light: #c9a97a;
    --text: #e8ddd0; 
    --muted: #9a8a75; 
    --quote-bg: #100d07; 
    --moral-bg: #080f04;
    --tag-bg: #1a1510; 
    --drawer-bg: #080604; 
    --drawer-text: #e8ddd0;
    --foreshadow-bg: #120e08; 
    --symbol-bg: #110e08; 
    --device-bg: #0f0c07;
    --emotion-bg: #120f09; 
    --relation-bg: #110e08; 
    --location-bg: #0b0f07;
    --keyword-bg: #1a1510; 
    --section-border: rgba(201,169,122,0.12);
    --input-bg: #1a1510;
    --input-border: #7c5c3a;
  }

  /* ── NIGHT MODE OVERRIDES ───────────────────────────────────────────────── */
  body.night .char-popup { background: #0d0d0d; border-color: rgba(124,92,58,0.3); }
  body.night .nav-btn:disabled:hover { background: var(--card); color: var(--accent); }
  body.night .float-nav { background: #c9a97a; color: #000; opacity: 0.5; }
  body.night .float-nav:hover { opacity: 1; }
  body.night .moral-text { color: #7aaa6a; }

  /* ── HEADER ─────────────────────────────────────────────────────────────── */
  header { 
    position: sticky; 
    top: 0; 
    z-index: 100; 
    background: var(--accent); 
    color: #fff; 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    padding: 12px 16px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); 
  }
  header h1 { 
    font-size: 1.05rem; 
    font-weight: normal; 
    letter-spacing: 0.03em; 
    flex: 1; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }
  #menuBtn { 
    background: none; 
    border: none; 
    cursor: pointer; 
    color: #fff; 
    padding: 6px; 
    display: flex; 
    flex-direction: column; 
    gap: 5px; 
    align-items: center; 
    justify-content: center; 
    flex-shrink: 0; 
  }
  #menuBtn span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; }
  
  .header-icon-btn { 
    background: none; 
    border: none; 
    cursor: pointer; 
    color: #fff; 
    padding: 5px 8px; 
    font-size: 0.74rem; 
    font-family: sans-serif; 
    letter-spacing: 0.05em; 
    text-transform: uppercase; 
    opacity: 0.85; 
    border: 1px solid rgba(255,255,255,0.3); 
    border-radius: 6px; 
    transition: all 0.2s; 
    flex-shrink: 0; 
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .header-icon-btn:hover { opacity: 1; background: rgba(255,255,255,0.15); }
  .header-icon-btn.active-view { background: rgba(255,255,255,0.2); opacity: 1; }

  #overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.5); }
  #overlay.open { display: block; }

  /* ── LEFT DRAWER ────────────────────────────────────────────────────────── */
  #drawer { 
    position: fixed; 
    top: 0; 
    left: -300px; 
    bottom: 0; 
    width: 290px; 
    z-index: 300; 
    background: var(--drawer-bg); 
    color: var(--drawer-text); 
    transition: left 0.3s ease; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
  }
  #drawer.open { left: 0; }
  #drawerHeader { padding: 16px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  #drawerHeaderTop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  #drawerHeaderLabel { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-light); }
  
  #themeToggle { 
    display: flex; 
    align-items: center; 
    gap: 7px; 
    cursor: pointer; 
    background: rgba(255,255,255,0.07); 
    border: 1px solid rgba(255,255,255,0.12); 
    border-radius: 20px; 
    padding: 5px 10px; 
    transition: background 0.2s; 
  }
  #themeToggle:hover { background: rgba(255,255,255,0.14); }
  #themeIcon { font-size: 0.95rem; line-height: 1; }
  #themeLabel { font-size: 0.72rem; color: rgba(245,240,232,0.7); font-family: sans-serif; letter-spacing: 0.05em; }
  
  #chapterList { flex: 1; overflow-y: auto; padding: 8px 0; }
  #chapterList::-webkit-scrollbar { width: 4px; }
  #chapterList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .book-group-header { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 10px 16px 8px; 
    cursor: pointer; 
    border-left: 3px solid transparent; 
    transition: all 0.2s; 
    user-select: none; 
  }
  .book-group-header:hover { background: rgba(255,255,255,0.05); }
  .book-group-header.has-active { border-left-color: var(--accent-light); }
  .book-group-title { font-size: 0.8rem; font-family: sans-serif; font-weight: 600; color: rgba(245,240,232,0.9); letter-spacing: 0.05em; }
  .book-group-chevron { font-size: 0.7rem; color: rgba(245,240,232,0.4); transition: transform 0.2s; }
  .book-group.collapsed .book-group-chevron { transform: rotate(-90deg); }
  .book-group.collapsed .book-chapters { display: none; }
  .book-chapters { padding-bottom: 4px; }

  /* Reverted to clean, link-only style for sidebar chapters */
  .ch-item { 
    padding: 9px 20px 9px 28px; 
    cursor: pointer; 
    font-size: 0.88rem; 
    color: rgba(245,240,232,0.65); 
    border-left: 3px solid transparent; 
    transition: all 0.2s; 
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ch-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .ch-item.active { border-left-color: var(--accent-light); color: #fff; background: rgba(255,255,255,0.1); }

  /* ── RIGHT DRAWER ───────────────────────────────────────────────────────── */
  #rightDrawer { 
    position: fixed; 
    top: 0; 
    right: -300px; 
    bottom: 0; 
    width: 290px; 
    z-index: 300; 
    background: var(--drawer-bg); 
    color: var(--drawer-text); 
    transition: right 0.3s ease; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
  }
  #rightDrawer.open { right: 0; }
  #rightDrawerHeader { padding: 14px 14px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
  
  .rd-tabs { display: flex; gap: 0; margin-top: 10px; }
  .rd-tab { 
    flex: 1; 
    background: none; 
    border: none; 
    border-bottom: 2px solid transparent; 
    padding: 8px 2px; 
    font-size: 0.65rem; 
    font-family: sans-serif; 
    color: rgba(245,240,232,0.5); 
    cursor: pointer; 
    letter-spacing: 0.05em; 
    text-transform: uppercase; 
    transition: all 0.2s; 
  }
  .rd-tab:hover { color: rgba(245,240,232,0.8); }
  .rd-tab.active { border-bottom-color: var(--accent-light); color: var(--accent-light); }
  
  .rd-panel { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
  .rd-panel.active { display: flex; }
  .rd-panel::-webkit-scrollbar { width: 4px; }
  .rd-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
  
  .sort-controls { display: flex; gap: 4px; padding: 10px 14px 0; flex-wrap: wrap; }
  .sort-btn { 
    flex: 1; 
    min-width: 48px; 
    background: rgba(255,255,255,0.07); 
    border: 1px solid rgba(255,255,255,0.12); 
    border-radius: 6px; 
    padding: 4px 2px; 
    font-size: 0.62rem; 
    font-family: sans-serif; 
    color: rgba(245,240,232,0.6); 
    cursor: pointer; 
    transition: all 0.2s; 
    text-align: center;
    white-space: nowrap; 
  }
  .sort-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .sort-btn.active { background: var(--accent-light); border-color: var(--accent-light); color: #000; font-weight: 600; }
  
  #charList, #locList, #bookFiltersList { padding: 8px 0; }

  /* Character & Location index lists */
  .char-index-item { padding: 12px 20px; cursor: pointer; font-size: 0.92rem; color: rgba(245,240,232,0.75); border-right: 3px solid transparent; transition: all 0.2s; display: flex; flex-direction: column; gap: 2px; }
  .char-index-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .char-index-item .ci-name { font-size: 0.92rem; }
  .char-index-item .ci-role { font-size: 0.7rem; color: rgba(245,240,232,0.4); font-style: italic; margin-bottom: 4px; }
  .char-index-item .ci-stats { display: flex; gap: 10px; align-items: center; margin-top: 2px; }
  .char-index-item .stat-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 0.68rem; font-family: sans-serif; color: rgba(245,240,232,0.5); }
  .char-index-item .stat-badge svg { width: 11px; height: 11px; fill: rgba(245,240,232,0.4); }
  .char-index-item:hover .stat-badge { color: rgba(245,240,232,0.85); }
  .char-index-item:hover .stat-badge svg { fill: rgba(245,240,232,0.75); }

  .loc-index-item { padding: 12px 20px; cursor: pointer; font-size: 0.88rem; color: rgba(245,240,232,0.75); border-right: 3px solid transparent; transition: all 0.2s; display: flex; flex-direction: column; gap: 3px; }
  .loc-index-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .loc-index-item .li-name { font-size: 0.9rem; }
  .loc-index-item .li-desc { font-size: 0.7rem; color: rgba(245,240,232,0.4); font-style: italic; line-height: 1.5; }
  .loc-index-item .li-chapter { font-size: 0.66rem; font-family: sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(201,169,122,0.6); margin-top: 2px; }

  /* ── BOOK FILTER TAB DESIGN ──────────────────────────────────────────────── */
  .book-filter-control-panel { padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; gap: 8px; }
  .filter-action-btn { flex: 1; padding: 6px; font-size: 0.68rem; font-family: sans-serif; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: rgba(245,240,232,0.7); cursor: pointer; border-radius: 4px; transition: all 0.2s; }
  .filter-action-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  
  .filter-book-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .filter-book-item:hover { background: rgba(255,255,255,0.05); }
  .filter-book-info { display: flex; flex-direction: column; gap: 2px; flex: 1; margin-right: 8px; }
  .filter-book-title { font-size: 0.88rem; color: rgba(245,240,232,0.9); }
  .filter-book-meta { font-size: 0.7rem; color: rgba(245,240,232,0.4); font-family: sans-serif; }
  
  /* Custom modern toggle checkbox style */
  .switch { position: relative; display: inline-block; width: 40px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background-color: rgba(255,255,255,0.15); transition: .3s; border-radius: 20px; }
  .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #fff; transition: .3s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--accent-light); }
  input:checked + .slider:before { transform: translateX(20px); }

  /* Empty/Unloaded warning view */
  .db-empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 20px; background: var(--card); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-top: 20px; border: 1px dashed var(--accent-light); }
  .db-empty-state svg { width: 64px; height: 64px; fill: var(--accent-light); margin-bottom: 16px; }
  .db-empty-state h3 { font-size: 1.15rem; font-weight: normal; margin-bottom: 8px; color: var(--text); }
  .db-empty-state p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; margin-bottom: 20px; max-width: 320px; }
  .db-empty-state .import-action-btn { background: var(--accent); color: #fff; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-family: sans-serif; font-size: 0.85rem; font-weight: 500; transition: background 0.2s; }
  .db-empty-state .import-action-btn:hover { background: var(--accent-light); color: var(--drawer-bg); }

  /* ── MAIN CONTENT AREA ──────────────────────────────────────────────────── */
  main { padding: 20px 16px 80px; max-width: 600px; margin: 0 auto; }

  .chapter-card { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .card-header { background: var(--accent); padding: 16px 18px; color: #fff; }
  .card-header .ch-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.75; margin-bottom: 4px; }
  .card-header h2 { font-size: 1.25rem; font-weight: normal; line-height: 1.3; }
  .mood-badge-row { margin-top: 6px; }
  .mood-badge { font-size: 0.65rem; font-family: sans-serif; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 2px 8px; display: inline-block; line-height: 1.4; }
  .card-body { padding: 18px; display: flex; flex-direction: column; gap: 0; }

  .sections-toggle-bar { display: flex; align-items: center; justify-content: flex-end; padding: 10px 18px 6px; border-bottom: 1px solid var(--section-border); gap: 8px; }
  .sections-toggle-btn { background: none; border: 1px solid rgba(124,92,58,0.25); border-radius: 6px; padding: 4px 10px; font-size: 0.68rem; font-family: sans-serif; color: var(--muted); cursor: pointer; letter-spacing: 0.05em; transition: all 0.2s; }
  .sections-toggle-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .section-block { padding: 18px 0; border-bottom: 1px solid var(--section-border); }
  .section-block:last-child { border-bottom: none; }
  .section-block.hidden-section { display: none; }
  .section-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 10px; font-family: sans-serif; font-weight: 600; display: flex; align-items: center; justify-content: space-between; cursor: default; }
  .section-collapse-btn { background: none; border: none; cursor: pointer; font-size: 0.75rem; color: var(--muted); padding: 0 2px; transition: transform 0.2s; line-height: 1; }
  .section-block.collapsed .section-body { display: none; }
  .section-block.collapsed .section-collapse-btn { transform: rotate(-90deg); }
  .summary-text { font-size: 0.97rem; line-height: 1.7; color: var(--text); }

  .events-list { display: flex; flex-direction: column; gap: 0; }
  .event-item { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
  .event-num { font-size: 0.72rem; font-family: sans-serif; font-weight: 700; color: var(--accent-light); min-width: 20px; padding-top: 3px; }
  .event-text { font-size: 0.9rem; line-height: 1.6; color: var(--text); border-left: 2px solid var(--section-border); padding-left: 12px; flex: 1; }

  .char-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .char-tag { background: var(--tag-bg); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; font-family: sans-serif; border: 1px solid rgba(124,92,58,0.2); transition: background 0.2s; user-select: none; }
  .char-tag:hover, .char-tag.active { background: var(--accent); color: #fff; }
  .char-popup { display: none; background: var(--card); border: 1px solid rgba(124,92,58,0.2); border-radius: 10px; padding: 14px; margin-top: 10px; font-size: 0.88rem; line-height: 1.6; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .char-popup.show { display: block; }
  .char-popup strong { color: var(--accent); display: block; margin-bottom: 3px; font-family: sans-serif; }
  .char-popup .role { color: var(--muted); font-style: italic; margin-bottom: 6px; font-size: 0.82rem; }
  .char-popup .cp-emotion-label { font-size: 0.65rem; font-family: sans-serif; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-top: 8px; margin-bottom: 3px; }
  .char-popup .cp-emotion { font-size: 0.83rem; color: var(--muted); font-style: italic; }

  .quotes-block { display: flex; flex-direction: column; gap: 10px; }
  .quote-item { background: var(--quote-bg); border-left: 3px solid var(--accent-light); border-radius: 0 8px 8px 0; padding: 12px 14px 12px 32px; font-size: 0.93rem; line-height: 1.65; color: var(--text); position: relative; }
  .quote-item::before { content: '\201C'; font-size: 2rem; color: var(--accent-light); position: absolute; top: 2px; left: 10px; line-height: 1; font-family: Georgia, serif; }
  .quote-text { font-style: italic; display: block; margin-bottom: 4px; }
  .quote-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .quote-author { font-family: sans-serif; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
  .quote-share-btn { background: none; border: 1px solid rgba(124,92,58,0.25); border-radius: 6px; padding: 3px 9px; font-size: 0.68rem; font-family: sans-serif; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.18s; letter-spacing: 0.04em; }
  .quote-share-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .quote-share-btn svg { width: 12px; height: 12px; fill: currentColor; }

  .moral-block { background: var(--moral-bg); border-radius: 10px; padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .moral-text { font-size: 0.9rem; line-height: 1.65; color: #3a5a2a; font-style: italic; }

  .emotions-grid { display: flex; flex-direction: column; gap: 8px; }
  .emotion-row { background: var(--emotion-bg); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 3px; border-left: 3px solid var(--accent-light); }
  .emotion-name { font-size: 0.82rem; font-family: sans-serif; font-weight: 600; color: var(--accent); }
  .emotion-text { font-size: 0.88rem; line-height: 1.55; color: var(--text); font-style: italic; }

  .relations-list { display: flex; flex-direction: column; gap: 8px; }
  .relation-item { background: var(--relation-bg); border-radius: 8px; padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .relation-chars { font-size: 0.88rem; font-family: sans-serif; color: var(--accent); flex: 1; }
  .relation-sep { font-size: 0.78rem; color: var(--accent-light); margin: 0 4px; }
  .relation-type { font-size: 0.78rem; color: var(--muted); font-style: italic; margin-top: 3px; }

  .foreshadow-list { display: flex; flex-direction: column; gap: 8px; }
  .foreshadow-item { background: var(--foreshadow-bg); border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; line-height: 1.6; color: var(--text); border-left: 3px solid #b8916a; }

  .symbols-grid { display: flex; flex-direction: column; gap: 8px; }
  .symbol-item { background: var(--symbol-bg); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 3px; }
  .symbol-name { font-size: 0.82rem; font-family: sans-serif; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
  .symbol-meaning { font-size: 0.87rem; line-height: 1.55; color: var(--text); }

  .devices-list { display: flex; flex-direction: column; gap: 8px; }
  .device-item { background: var(--device-bg); border: 1px solid var(--section-border); padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
  .device-name { font-size: 0.78rem; font-family: sans-serif; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  .device-example { font-size: 0.87rem; line-height: 1.55; color: var(--muted); font-style: italic; }

  .keywords-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .keyword-chip { background: var(--keyword-bg); color: var(--muted); padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-family: sans-serif; border: 1px solid var(--section-border); letter-spacing: 0.02em; }

  .locations-list { display: flex; flex-direction: column; gap: 8px; }
  .location-item { background: var(--location-bg); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 3px; border-left: 3px solid #7aaa6a; }

<!-- ── MAIN CONTAINER ──────────────────────────────────────────────────────── -->

  <!-- Interactive Viewports will render here -->

<script>
// ── LOCAL STORAGE & PERSISTENCE ENGINE (INDEXEDDB) ───────────────────────────
const DB_NAME = 'BookNotesPersistenceDB';
const DB_VERSION = 1;
const STORE_NAME = 'seriesDataStore';
const SERIES_KEY = 'activeSeriesData';
const BOOK_FILTER_KEY = 'bookFiltersState';

let db = null;

// Standard fallback structured series JSON
const defaultMockSeriesData = {};

function initIndexedDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    
    request.onerror = (e) => reject('Database failed to initialize');
    
    request.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    
    request.onupgradeneeded = (e) => {
      const activeDb = e.target.result;
      if (!activeDb.objectStoreNames.contains(STORE_NAME)) {
        activeDb.createObjectStore(STORE_NAME);
      }
    };
  });
}

function saveToDB(key, val) {
  return new Promise((resolve, reject) => {
    if (!db) { reject('Database unavailable'); return; }
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const request = store.put(val, key);
    request.onsuccess = () => resolve();
    request.onerror = () => reject('Save transaction aborted');
  });
}

function getFromDB(key) {
  return new Promise((resolve) => {
    if (!db) { resolve(null); return; }
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const request = store.get(key);
    request.onsuccess = (e) => resolve(e.target.result);
    request.onerror = () => resolve(null);
  });
}

// ── GLOBAL APPLICATION STATE ────────────────────────────────────────────────
let seriesData = null;
let flatChapters = [];      // Calculated list of readable indices: { bi, ci }
let flatIndex = 0;          // Position pointing to flatChapters
let currentView = 'chapter';
let isNight = false;
let sortMode = 'default';
let sortLocMode = 'default';
let rdActiveTab = 'chars';
let activeAnalysisTab = 'relationships';
let currentProfileName = '';
let selectedDeviceFilter = 'All';

// Book Selection/Filter Array of Boolean flags corresponding to seriesData.books
let selectedBooksMask = []; 

// Core collapsible sections
const sectionDefs = [
  { id: 'sec-summary',       label: 'Summary' },
  { id: 'sec-events',        label: 'Key Events' },
  { id: 'sec-characters',    label: 'Characters' },
  { id: 'sec-emotions',      label: 'Emotions' },
  { id: 'sec-quotes',        label: 'Quotes' },
  { id: 'sec-relationships', label: 'Relationships' },
  { id: 'sec-foreshadow',    label: 'Foreshadowing' },
  { id: 'sec-symbols',       label: 'Symbols & Motifs' },
  { id: 'sec-devices',       label: 'Literary Devices' },
  { id: 'sec-locations',     label: 'Locations' },
  { id: 'sec-keywords',      label: 'Keywords' },
  { id: 'sec-moral',         label: 'Moral' }
];
const sectionVisibility = {};
sectionDefs.forEach(s => { sectionVisibility[s.id] = true; });

// ── INIT ENGINE ─────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  try {
    await initIndexedDB();
    const storedSeries = await getFromDB(SERIES_KEY);
    if (storedSeries && storedSeries.books && storedSeries.books.length > 0) {
      seriesData = storedSeries;
    } else {
      seriesData = defaultMockSeriesData;
      await saveToDB(SERIES_KEY, seriesData);
    }
    
    // Load previously selected book configuration
    const storedFilters = await getFromDB(BOOK_FILTER_KEY);
    if (storedFilters && Array.isArray(storedFilters)) {
      selectedBooksMask = storedFilters;
    } else {
      selectedBooksMask = new Array(seriesData.books.length).fill(true);
    }

    refreshAppWorkspace();
  } catch (err) {
    console.error("IndexedDB startup crash. Using transient fallback state.", err);
    seriesData = defaultMockSeriesData;
    selectedBooksMask = new Array(seriesData.books.length).fill(true);
    refreshAppWorkspace();
  }
});

function refreshAppWorkspace() {
  if (seriesData && seriesData.books) {
    document.getElementById('seriesTitle').textContent = seriesData.series || 'Series Notes';
    
    // Defensive check to ensure the size of the book selection mask matches loaded book length
    if (!Array.isArray(selectedBooksMask) || selectedBooksMask.length !== seriesData.books.length) {
      selectedBooksMask = new Array(seriesData.books.length).fill(true);
    }
  }
  
  rebuildFlatChapters();
  renderSidebar();
  renderRightDrawer();
  
  if (flatChapters.length > 0) {
    // Keep index clamped
    if (flatIndex >= flatChapters.length) flatIndex = 0;
    renderChapter();
  } else {
    renderEmptyState();
  }
}

// Rebuild active traversable chapters considering book filters
function rebuildFlatChapters() {
  flatChapters = [];
  if (!seriesData || !seriesData.books) return;
  for (let bi = 0; bi < seriesData.books.length; bi++) {
    if (selectedBooksMask && selectedBooksMask[bi] === false) continue; // Filtered book skip
    const bk = seriesData.books[bi];
    if (!bk || !bk.chapters) continue;
    for (let ci = 0; ci < bk.chapters.length; ci++) {
      flatChapters.push({ bi, ci });
    }
  }
}

// ── IMPORT TRIGGER ENGINE ───────────────────────────────────────────────────
function triggerImport() {
  document.getElementById('jsonFileInput').click();
}

async function handleJSONUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.series || !Array.isArray(parsed.books)) {
        throw new Error("Invalid structure. Must contain a 'series' name and a 'books' array.");
      }
      
      // Save valid data
      seriesData = parsed;
      await saveToDB(SERIES_KEY, seriesData);
      
      // Reset filter configurations
      selectedBooksMask = new Array(seriesData.books.length).fill(true);
      await saveToDB(BOOK_FILTER_KEY, selectedBooksMask);
      
      flatIndex = 0;
      currentView = 'chapter';
      refreshAppWorkspace();
      notifyUser("Success: Series data imported & persisted safely.");
    } catch (err) {
      notifyUser("Error: Please provide a valid JSON file structure. Details: " + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // Reset input element
}

function notifyUser(msg) {
  const alertEl = document.createElement('div');
  alertEl.style.position = 'fixed';
  alertEl.style.bottom = '20px';
  alertEl.style.left = '50%';
  alertEl.style.transform = 'translateX(-50%)';
  alertEl.style.background = 'var(--drawer-bg)';
  alertEl.style.color = 'var(--drawer-text)';
  alertEl.style.padding = '12px 24px';
  alertEl.style.borderRadius = '30px';
  alertEl.style.zIndex = '9999';
  alertEl.style.fontFamily = 'sans-serif';
  alertEl.style.fontSize = '0.85rem';
  alertEl.style.boxShadow = '0 4px 20px rgba(0,0,0,0.3)';
  alertEl.style.border = '1px solid var(--accent-light)';
  alertEl.textContent = msg;
  document.body.appendChild(alertEl);
  setTimeout(() => { alertEl.remove(); }, 3200);
}

// Empty Viewport rendering in case no books are filtered
function renderEmptyState() {
  document.getElementById('main').innerHTML = `
    <div class="db-empty-state">
      <svg viewBox="0 0 24 24">
        <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 4h2v5l-1-.75L9 9V4zm9 16H6V4h1v9l2.5-1.88L12 13V4h6v16z"/>
      </svg>
      <h3>No Active Books Visible</h3>
      <p>Ensure that at least one book in the "Books" filter tab of your Index drawer is selected to continue analyzing.</p>
      <button class="import-action-btn" onclick="bulkFilterBooks(true)">Enable All Books</button>
    </div>
  `;
  updateFloatBtns();
}

// Comprehensive global indices matching currently filtered books with crash safety guards
function getCharacterIndex() {
  const seen = {};
  const chars = [];
  if (!seriesData || !seriesData.books) return chars;
  
  for (let bi = 0; bi < seriesData.books.length; bi++) {
    if (selectedBooksMask && selectedBooksMask[bi] === false) continue; // Filtered book skip
    const bk = seriesData.books[bi];
    if (!bk || !bk.chapters) continue;
    
    for (let ci = 0; ci < bk.chapters.length; ci++) {
      const ch = bk.chapters[ci];
      if (!ch) continue;
      
      const characters = Array.isArray(ch.characters) ? ch.characters : [];
      for (let j = 0; j < characters.length; j++) {
        const c = characters[j];
        if (!c || !c.name) continue;
        const cName = String(c.name);
        if (!seen[cName]) {
          seen[cName] = { 
            name: cName, 
            role: c.role || '', 
            chaptersCount: 0, 
            actionsCount: 0, 
            quotesCount: 0 
          };
          chars.push(seen[cName]);
        }
        seen[cName].chaptersCount++;
        if (c.actions && String(c.actions).trim()) seen[cName].actionsCount++;
      }
      
      const quotes = Array.isArray(ch.quotes) ? ch.quotes : [];
      for (let q = 0; q < quotes.length; q++) {
        const quoteItem = quotes[q];
        if (!quoteItem) continue;
        const qcn = quoteItem.character_name;
        if (!qcn) continue;
        const qcnStr = String(qcn);
        chars.forEach(charObj => {
          const charName = charObj.name;
          if (qcnStr === charName || charName.indexOf(qcnStr) !== -1 || qcnStr.indexOf(charName.split(' ')[0]) !== -1) {
            charObj.quotesCount++;
          }
        });
      }
    }
  }

  // Alpha / Numeric custom sort operations
  if (sortMode === 'asc' || sortMode === 'desc') {
    const dir = sortMode === 'asc' ? 1 : -1;
    chars.sort((a, b) => {
      const na = Array.from(a.name || ''), nb = Array.from(b.name || '');
      const len = Math.min(na.length, nb.length);
      for (let k = 0; k < len; k++) {
        const ca = na[k].codePointAt(0), cb = nb[k].codePointAt(0);
        if (ca !== cb) return (ca - cb) * dir;
      }
      return (na.length - nb.length) * dir;
    });
  } else if (sortMode === 'quotes') {
    chars.sort((a, b) => b.quotesCount - a.quotesCount);
  }
  return chars;
}

function getLocationIndex() {
  const seen = {};
  const locs = [];
  if (!seriesData || !seriesData.books) return locs;
  
  for (let bi = 0; bi < seriesData.books.length; bi++) {
    if (selectedBooksMask && selectedBooksMask[bi] === false) continue; // Filtered book skip
    const bk = seriesData.books[bi];
    if (!bk || !bk.chapters) continue;
    
    for (let ci = 0; ci < bk.chapters.length; ci++) {
      const ch = bk.chapters[ci];
      if (!ch || !ch.locations || !Array.isArray(ch.locations)) continue;
      
      for (let j = 0; j < ch.locations.length; j++) {
        const l = ch.locations[j];
        if (!l || !l.name) continue;
        const lName = String(l.name);
        if (!seen[lName]) {
          seen[lName] = { name: lName, description: l.description || '', refs: [] };
          locs.push(seen[lName]);
        }
        seen[lName].refs.push((bk.title || 'Untitled') + ' · ' + (ch.chapter || `Chapter ${ci + 1}`));
      }
    }
  }

  if (sortLocMode === 'asc' || sortLocMode === 'desc') {
    const dir = sortLocMode === 'asc' ? 1 : -1;
    locs.sort((a, b) => {
      const na = Array.from(a.name || ''), nb = Array.from(b.name || '');
      const len = Math.min(na.length, nb.length);
      for (let k = 0; k < len; k++) {
        const ca = na[k].codePointAt(0), cb = nb[k].codePointAt(0);
        if (ca !== cb) return (ca - cb) * dir;
      }
      return (na.length - nb.length) * dir;
    });
  }
  return locs;
}

          }

    }

      html += '<p class="empty-note">No matching literary devices found in active books.</p>';
    }
    html += '</div>';

    document.getElementById('main').innerHTML = html;
  } catch (err) {
    console.error("Crash during renderAnalysis:", err);
    document.getElementById('main').innerHTML = `<div class="db-empty-state"><h3>Analytical Engine Failure</h3><p>${err.message}</p></div>`;
  }
}

// ── CHARACTER PROFILE INTERFACE ──────────────────────────────────────────────
function openCharacterProfile(name) {
  try {
    currentView = 'character';
    currentProfileName = name;
    closeAllDrawers();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    let role = '';
    // Identify role matching character from database safely
    if (seriesData && seriesData.books) {
      for (let bi = 0; bi < seriesData.books.length && !role; bi++) {
        const bk = seriesData.books[bi];
        if (!bk || !bk.chapters) continue;
        for (let ci = 0; ci < bk.chapters.length && !role; ci++) {
          const ch = bk.chapters[ci];
          if (!ch || !ch.characters) continue;
          ch.characters.forEach(c => {
            if (c && c.name === name) role = c.role || '';
          });
        }
      }
    }

    const quotesByRef = [], actionsByRef = [], emotionsByRef = [];
    if (seriesData && seriesData.books) {
      for (let bi = 0; bi < seriesData.books.length; bi++) {
        if (selectedBooksMask && selectedBooksMask[bi] === false) continue; // Filter validation
        const bk = seriesData.books[bi];
        if (!bk || !bk.chapters) continue;
        
        for (let ci = 0; ci < bk.chapters.length; ci++) {
          const ch = bk.chapters[ci];
          if (!ch) continue;
          const refLabel = (bk.title || 'Untitled Book') + ' · ' + (ch.chapter || `Chapter ${ci + 1}`);
          
          // Actions
          const characters = Array.isArray(ch.characters) ? ch.characters : [];
          characters.forEach(c => {
            if (c && c.name === name && c.actions) {
              actionsByRef.push({ ref: refLabel, action: c.actions });
            }
          });
          // Emotions
          if (ch.character_emotions) {
            ch.character_emotions.forEach(em => {
              if (em && em.name && (em.name === name || name.indexOf(em.name) !== -1 || em.name.indexOf(name.split(' ')[0]) !== -1)) {
                if (em.emotion) {
                  emotionsByRef.push({ ref: refLabel, emotion: em.emotion });
                }
              }
            });
          }
          // Quotes
          const qs = [];
          const quotes = Array.isArray(ch.quotes) ? ch.quotes : [];
          quotes.forEach(q => {
            if (!q) return;
            const qcn = q.character_name;
            if (qcn && (qcn === name || name.indexOf(qcn) !== -1 || qcn.indexOf(name.split(' ')[0]) !== -1)) {
              if (q.quote) qs.push(q.quote);
            }
          });
          if (qs.length) quotesByRef.push({ ref: refLabel, quotes: qs });
        }
      }
    }

    let html = '<button class="profile-back" onclick="backToChapter()">&#8592; Back</button>';
    html += `
      <div class="profile-header">
        <div class="p-name">${name}</div>
        <div class="p-role">${role || 'Character'}</div>
      </div>
    `;
    
    html += '<div class="profile-section"><div class="profile-section-title">Actions</div>';
    if (!actionsByRef.length) html += '<p class="empty-note">No actions recorded in selected books.</p>';
    else actionsByRef.forEach(a => {
      html += `<div class="timeline-group"><div class="timeline-ch-label">${a.ref}</div><div class="action-item">${a.action}</div></div>`;
    });
    html += '</div>';

    html += '<div class="profile-section"><div class="profile-section-title">Emotions</div>';
    if (!emotionsByRef.length) html += '<p class="empty-note">No emotions recorded in selected books.</p>';
    else emotionsByRef.forEach(e => {
      html += `<div class="timeline-group"><div class="timeline-ch-label">${e.ref}</div><div class="action-item" style="font-style:italic;color:var(--muted)">${e.emotion}</div></div>`;
    });
    html += '</div>';

    html += '<div class="profile-section"><div class="profile-section-title">Quotes</div>';
    if (!quotesByRef.length) html += '<p class="empty-note">No quotes recorded in selected books.</p>';
    else quotesByRef.forEach(qg => {
      html += `
        <div class="timeline-group"><div class="timeline-ch-label">${qg.ref}</div><div class="quotes-block">
      `;
      qg.quotes.forEach(q => {
        html += `<div class="quote-item"><span class="quote-text">${q}</span></div>`;
      });
      html += '</div></div>';
    });
    html += '</div>';

    document.getElementById('main').innerHTML = html;
    renderSidebar();
    updateFloatBtns();
  } catch (err) {
    console.error("Crash during openCharacterProfile:", err);
  }
}

function backToChapter() {
  currentView = 'chapter';
  if (flatChapters.length > 0) renderChapter();
  else renderEmptyState();
}

// ── RENDER ENGINE: ACTIVE CHAPTER VIEWPORT ───────────────────────────────────
function toggleChar(idx) {
  const popup = document.getElementById('popup-' + idx);
  const btn = document.getElementById('chartag-' + idx);
  if (!popup || !btn) return;
  const isOpen = popup.classList.contains('show');
  
  document.querySelectorAll('.char-popup').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.char-tag').forEach(t => t.classList.remove('active'));
  
  if (!isOpen) {
    popup.classList.add('show');
    btn.classList.add('active');
  }
}

function collapseSection(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('collapsed');
}

function renderChapter() {
  try {
    const bk = currentBook();
    const ch = currentChapter();
    if (!bk || !ch) {
      renderEmptyState();
      return;
    }
    
    const total = flatChapters.length;
    const analysisBtn = document.getElementById('analysisBtn');
    const rightDrawerBtn = document.getElementById('rightDrawerBtn');
    if (analysisBtn) analysisBtn.classList.remove('active-view');
    if (rightDrawerBtn) rightDrawerBtn.classList.remove('active-view');

    function secLabel(id, label) {
      return `<div class="section-label">${label}<button class="section-collapse-btn" onclick="collapseSection('${id}')">&#x25BC;</button></div>`;
    }
    function secBlock(id, label, bodyHTML) {
      return `<div class="section-block${!sectionVisibility[id] ? ' hidden-section' : ''}" id="${id}">${secLabel(id, label)}<div class="section-body">${bodyHTML}</div></div>`;
    }

    const summaryHTML = `<p class="summary-text">${ch.summary || 'No summary available.'}</p>`;

    let eventsHTML = '<div class="events-list">';
    const keyEvents = Array.isArray(ch.key_events) ? ch.key_events : [];
    keyEvents.forEach((ev, i) => {
      eventsHTML += `<div class="event-item"><span class="event-num">${i + 1}</span><div class="event-text">${ev}</div></div>`;
    });
    if (!keyEvents.length) eventsHTML += '<div class="empty-note">No key events recorded.</div>';
    eventsHTML += '</div>';

    let charsHTML = '<div class="char-tags">';
    const characters = Array.isArray(ch.characters) ? ch.characters : [];
    characters.forEach((c, i) => {
      if (!c || !c.name) return;
      let emotionStr = '';
      if (ch.character_emotions && Array.isArray(ch.character_emotions)) {
        ch.character_emotions.forEach(em => {
          if (em && em.name) {
            const emName = String(em.name);
            const charName = String(c.name);
            const firstWord = charName.split(' ')[0] || '';
            if (emName === charName || charName.indexOf(emName) !== -1 || (firstWord && emName.indexOf(firstWord) !== -1)) {
              emotionStr = em.emotion || '';
            }
          }
        });
      }
      const cleanEscapedName = String(c.name).replace(/'/g, "\\'");
      charsHTML += `
        <div>
          <button class="char-tag" id="chartag-${i}" onclick="toggleChar(${i})">${c.name}</button>
          <div class="char-popup" id="popup-${i}">
            <strong>${c.name}</strong>
            <div class="role">${c.role || ''}</div>
            <div class="actions">${c.actions || ''}</div>
            ${emotionStr ? `<div class="cp-emotion-label">Emotion</div><div class="cp-emotion">${emotionStr}</div>` : ''}
            <div style="margin-top:10px;">
              <button onclick="openCharacterProfile('${cleanEscapedName}')" style="background:none;border:1px solid rgba(124,92,58,0.3);border-radius:6px;padding:5px 10px;font-size:0.75rem;font-family:sans-serif;color:var(--accent);cursor:pointer;">
                View Profile &#8594;
              </button>
            </div>
          </div>
        </div>
      `;
    });
    if (!characters.length) charsHTML += '<div class="empty-note">No characters recorded.</div>';
    charsHTML += '</div>';

    let emotionsHTML = '<div class="emotions-grid">';
    const characterEmotions = Array.isArray(ch.character_emotions) ? ch.character_emotions : [];
    characterEmotions.forEach(em => {
      if (!em || !em.name) return;
      emotionsHTML += `
        <div class="emotion-row">
          <div class="emotion-name">${em.name}</div>
          <div class="emotion-text">${em.emotion || ''}</div>
        </div>
      `;
    });
    if (!characterEmotions.length) emotionsHTML += '<div class="empty-note">No emotions recorded.</div>';
    emotionsHTML += '</div>';

    let quotesHTML = '<div class="quotes-block">';
    const quotes = Array.isArray(ch.quotes) ? ch.quotes : [];
    quotes.forEach(q => {
      if (!q || !q.quote) return;
      const quoteText = String(q.quote);
      const charName = String(q.character_name || 'Unknown');
      const chName = String(ch.chapter || '');
      
      const sq = quoteText.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      const sc = charName.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      const scp = chName.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      quotesHTML += `
        <div class="quote-item">
          <span class="quote-text">${quoteText}</span>
          <div class="quote-footer">
            <span class="quote-author">— ${charName}</span>
            <button class="quote-share-btn" onclick="openQuoteModal('${sq}','${sc}','${scp}')">
              <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
              Image
            </button>
          </div>
        </div>
      `;
    });
    if (!quotes.length) quotesHTML += '<div class="empty-note">No quotes recorded.</div>';
    quotesHTML += '</div>';

    let relHTML = '<div class="relations-list">';
    const relationships = Array.isArray(ch.character_relationships) ? ch.character_relationships : [];
    relationships.forEach(r => {
      if (!r) return;
      const rChars = Array.isArray(r.characters) ? r.characters : [];
      if (rChars.length === 0) return;
      relHTML += `
        <div class="relation-item">
          <div style="flex:1">
            <div class="relation-chars">${rChars.join('<span class="relation-sep"> — </span>')}</div>
            <div class="relation-type">${r.relationship || ''}</div>
          </div>
        </div>
      `;
    });
    if (!relationships.length) relHTML += '<div class="empty-note">No relationships recorded.</div>';
    relHTML += '</div>';

    let foreshadowHTML = '<div class="foreshadow-list">';
    const foreshadowing = Array.isArray(ch.foreshadowing) ? ch.foreshadowing : [];
    foreshadowing.forEach(f => {
      foreshadowHTML += `<div class="foreshadow-item">${f}</div>`;
    });
    if (!foreshadowing.length) foreshadowHTML += '<div class="empty-note">No foreshadowing recorded.</div>';
    foreshadowHTML += '</div>';

    let symbolsHTML = '<div class="symbols-grid">';
    const symbols = Array.isArray(ch.symbols_motifs) ? ch.symbols_motifs : [];
    symbols.forEach(s => {
      if (!s) return;
      symbolsHTML += `
        <div class="symbol-item">
          <div class="symbol-name">${s.symbol || ''}</div>
          <div class="symbol-meaning">${s.meaning || ''}</div>
        </div>
      `;
    });
    if (!symbols.length) symbolsHTML += '<div class="empty-note">No symbols recorded.</div>';
    symbolsHTML += '</div>';

    let devicesHTML = '<div class="devices-list">';
    const literaryDevices = Array.isArray(ch.literary_devices) ? ch.literary_devices : [];
    literaryDevices.forEach(d => {
      if (!d) return;
      devicesHTML += `
        <div class="device-item">
          <div class="device-name">${d.device || ''}</div>
          <div class="device-example">${d.example || ''}</div>
        </div>
      `;
    });
    if (!literaryDevices.length) devicesHTML += '<div class="empty-note">No literary devices recorded.</div>';
    devicesHTML += '</div>';

    let locationsHTML = '<div class="locations-list">';
    const locations = Array.isArray(ch.locations) ? ch.locations : [];
    locations.forEach(l => {
      if (!l) return;
      locationsHTML += `
        <div class="location-item">
          <div class="location-name">${l.name || ''}</div>
          <div class="location-desc">${l.description || ''}</div>
        </div>
      `;
    });
    if (!locations.length) locationsHTML += '<div class="empty-note">No locations recorded.</div>';
    locationsHTML += '</div>';

    let keywordsHTML = '<div class="keywords-row">';
    const keywords = Array.isArray(ch.keywords) ? ch.keywords : [];
    keywords.forEach(k => {
      keywordsHTML += `<span class="keyword-chip">${k}</span>`;
    });
    if (!keywords.length) keywordsHTML += '<div class="empty-note">No keywords recorded.</div>';
    keywordsHTML += '</div>';

    const moralHTML = `<div class="moral-block"><div class="moral-text">${ch.moral || 'No moral themes recorded.'}</div></div>`;

    const bkChNum = flatChapters[flatIndex].ci + 1;
    const totalChsInBook = bk.chapters.length;
    const currentOverallNumber = flatIndex + 1;
    const counterHTML = `${bk.title || 'Untitled Book'}<br>Ch ${bkChNum} of ${totalChsInBook} &nbsp;·&nbsp; ${currentOverallNumber} / ${total} overall`;

    document.getElementById('main').innerHTML = `
      <div class="chapter-card">
        <div class="card-header">
          <div class="ch-label">${seriesData.series || 'Series'} · ${bk.title || 'Untitled Book'}</div>
          <h2>${ch.chapter || `Chapter ${bkChNum}`}</h2>
          ${ch.mood ? `<div class="mood-badge-row"><span class="mood-badge">${ch.mood}</span></div>` : ''}
        </div>
        <div class="sections-toggle-bar">
          <button class="sections-toggle-btn" onclick="openSectionsPanel()">Sections &#x25BE;</button>
        </div>
        <div class="card-body">
          ${secBlock('sec-summary',       'Summary',            summaryHTML)}
          ${secBlock('sec-events',        'Key Events',         eventsHTML)}
          ${secBlock('sec-characters',    'Characters',         charsHTML)}
          ${secBlock('sec-emotions',      'Character Emotions', emotionsHTML)}
          ${secBlock('sec-quotes',        'Quotes',             quotesHTML)}
          ${secBlock('sec-relationships', 'Relationships',      relHTML)}
          ${secBlock('sec-foreshadow',    'Foreshadowing',      foreshadowHTML)}
          ${secBlock('sec-symbols',       'Symbols & Motifs',   symbolsHTML)}
          ${secBlock('sec-devices',       'Literary Devices',   devicesHTML)}
          ${secBlock('sec-locations',     'Locations',          locationsHTML)}
          ${secBlock('sec-keywords',      'Keywords',           keywordsHTML)}
          ${secBlock('sec-moral',         'Moral',              moralHTML)}
        </div>
      </div>
      <div class="nav-buttons">
        <button class="nav-btn" ${flatIndex === 0 ? 'disabled' : ''} onclick="stepNav(-1)">&#8592; Prev</button>
        <span class="ch-counter">${counterHTML}</span>
        <button class="nav-btn" ${flatIndex === total - 1 ? 'disabled' : ''} onclick="stepNav(1)">Next &#8594;</button>
      </div>
    `;

    renderSidebar();
    updateFloatBtns();
  } catch (err) {
    console.error("Critical rendering exception caught in renderChapter():", err);
    document.getElementById('main').innerHTML = `
      <div class="db-empty-state">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <h3>Failed to Render Chapter Content</h3>
        <p>A rendering error occurred inside the layout pipeline. This is usually caused by missing or differently formatted fields in your uploaded JSON file.</p>
        <div style="font-family: monospace; font-size: 0.78rem; text-align: left; padding: 12px; background: rgba(220,50,50,0.06); border: 1px solid rgba(220,50,50,0.15); border-radius: 6px; margin-top: 15px; color: #a00; overflow-x: auto; max-width: 100%;">
          Error trace: ${err.message}
        </div>
        <button class="import-action-btn" style="margin-top: 20px; background: var(--accent);" onclick="goToFlat(0)">Reset to Chapter 1</button>
      </div>
    `;
  }
}

// ── DESIGN: QUOTE IMAGE CARD GENERATOR ───────────────────────────────────────
let currentQuoteData = null;

function openQuoteModal(quoteText, characterName, chapterTitle) {
  currentQuoteData = { quote: quoteText, character: characterName, chapter: chapterTitle };
  drawQuoteCanvas(quoteText, characterName);
  document.getElementById('quoteModal').classList.add('open');
}

function closeQuoteModal() {
  document.getElementById('quoteModal').classList.remove('open');
  currentQuoteData = null;
}

function drawQuoteCanvas(quoteText, characterName) {
  const canvas = document.getElementById('quoteCanvas');
  const ctx = canvas.getContext('2d');
  const W = 1080, H = 1080;
  canvas.width = W; 
  canvas.height = H;
  
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, '#2a1a0a'); 
  bgGrad.addColorStop(0.45, '#3d2610'); 
  bgGrad.addColorStop(1, '#1e1208');
  ctx.fillStyle = bgGrad; 
  ctx.fillRect(0, 0, W, H);
  
  ctx.save(); 
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 4000; i++) { 
    ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000'; 
    ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1); 
  }
  ctx.restore();
  
  const bPad = 48;
  ctx.save(); 
  ctx.strokeStyle = '#c9a97a'; 
  ctx.globalAlpha = 0.35; 
  ctx.lineWidth = 1.5;
  ctx.strokeRect(bPad, bPad, W - bPad * 2, H - bPad * 2);
  ctx.globalAlpha = 0.15; 
  ctx.lineWidth = 0.5;
  ctx.strokeRect(bPad + 10, bPad + 10, W - (bPad + 10) * 2, H - (bPad + 10) * 2); 
  ctx.restore();
  
  drawCornerOrnament(ctx, bPad + 2, bPad + 2, 0); 
  drawCornerOrnament(ctx, W - bPad - 2, bPad + 2, 90);
  drawCornerOrnament(ctx, W - bPad - 2, H - bPad - 2, 180); 
  drawCornerOrnament(ctx, bPad + 2, H - bPad - 2, 270);
  
  ctx.save(); 
  ctx.font = '260px Georgia,serif'; 
  ctx.fillStyle = '#c9a97a'; 
  ctx.globalAlpha = 0.09;
  ctx.textAlign = 'left'; 
  ctx.textBaseline = 'top'; 
  ctx.fillText('\u201C', 68, 60); 
  ctx.restore();
  
  const ruleY = 200;
  ctx.save(); 
  ctx.strokeStyle = '#c9a97a'; 
  ctx.globalAlpha = 0.4; 
  ctx.lineWidth = 1;
  ctx.beginPath(); 
  ctx.moveTo(120, ruleY); 
  ctx.lineTo(960, ruleY); 
  ctx.stroke();
  ctx.globalAlpha = 0.7; 
  ctx.fillStyle = '#c9a97a'; 
  ctx.save();
  ctx.translate(W / 2, ruleY); 
  ctx.rotate(Math.PI / 4); 
  ctx.fillRect(-6,-6,12,12); 
  ctx.restore(); ctx.restore();
  
  const quotePad = 110, quoteMaxW = W - quotePad * 2;
  const qsz = pickFontSize(ctx, quoteText, quoteMaxW, W, H);
  ctx.save(); 
  ctx.fillStyle = '#f5e8d0'; 
  ctx.textAlign = 'center'; 
  ctx.textBaseline = 'alphabetic';
  const lines = wrapText(ctx, quoteText, quoteMaxW, qsz);
  const lineH = qsz * 1.72, totalTextH = lines.length * lineH;
  const quoteStartY = (H / 2) - (totalTextH / 2) + 30;
  
  ctx.font = 'italic ' + qsz + 'px "Noto Serif Tamil","Latha","Tamil MN",Georgia,serif';
  lines.forEach((line, i) => { 
    ctx.fillText(line, W / 2, quoteStartY + i * lineH); 
  }); 
  ctx.restore();
  
  const rule2Y = quoteStartY + totalTextH + 56;
  ctx.save(); 
  ctx.strokeStyle = '#c9a97a'; 
  ctx.globalAlpha = 0.4; 
  ctx.lineWidth = 1;
  ctx.beginPath(); 
  ctx.moveTo(120, rule2Y); 
  ctx.lineTo(960, rule2Y); 
  ctx.stroke();
  ctx.globalAlpha = 0.7; 
  ctx.fillStyle = '#c9a97a'; 
  ctx.save();
  ctx.translate(W / 2, rule2Y); 
  ctx.rotate(Math.PI / 4); 
  ctx.fillRect(-6,-6,12,12); 
  ctx.restore(); ctx.restore();
  
  ctx.save(); 
  ctx.font = '500 38px "Noto Serif Tamil","Latha",Georgia,sans-serif';
  ctx.fillStyle = '#c9a97a'; 
  ctx.textAlign = 'center'; 
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('— ' + characterName, W / 2, rule2Y + 70); 
  ctx.restore();
  
  const barY = H - bPad - 68;
  ctx.save(); 
  ctx.font = '500 30px "Noto Serif Tamil","Latha",Georgia,sans-serif';
  ctx.fillStyle = '#c9a97a'; 
  ctx.globalAlpha = 0.9; 
  ctx.textAlign = 'center'; 
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(currentBook() ? currentBook().title + '  ·  ' + (seriesData ? seriesData.series : '') : (seriesData ? seriesData.series : ''), W / 2, barY + 34); 
  ctx.restore();
  
  ctx.save(); 
  ctx.strokeStyle = '#c9a97a'; 
  ctx.globalAlpha = 0.22; 
  ctx.lineWidth = 1;
  ctx.beginPath(); 
  ctx.moveTo(280, barY + 6); 
  ctx.lineTo(800, barY + 6); 
  ctx.stroke(); 
  ctx.restore();
}

function drawCornerOrnament(ctx, x, y, angleDeg) {
  ctx.save(); 
  ctx.translate(x, y); 
  ctx.rotate(angleDeg * Math.PI / 180);
  ctx.strokeStyle = '#c9a97a'; 
  ctx.globalAlpha = 0.45; 
  ctx.lineWidth = 1.5;
  ctx.beginPath(); 
  ctx.moveTo(0, 28); 
  ctx.lineTo(0, 0); 
  ctx.lineTo(28, 0); 
  ctx.stroke();
  ctx.globalAlpha = 0.3; 
  ctx.lineWidth = 0.8;
  ctx.beginPath(); 
  ctx.moveTo(0, 18); 
  ctx.lineTo(0, 8); 
  ctx.lineTo(8, 8); 
  ctx.stroke(); 
  ctx.restore();
}

function pickFontSize(ctx, text, maxW, W, H) {
  const sizes = [72, 64, 56, 50, 46, 42, 38, 34, 30, 26];
  const maxLines = 7;
  const availH = H * 0.46;
  
  for (let s = 0; s < sizes.length; s++) {
    const sz = sizes[s];
    ctx.font = 'italic ' + sz + 'px "Noto Serif Tamil","Latha",Georgia,serif';
    const ls = wrapText(ctx, text, maxW, sz);
    if (ls.length <= maxLines && ls.length * sz * 1.72 <= availH) return sz;
  }
  return 26;
}

function wrapText(ctx, text, maxW, fontSize) {
  ctx.font = 'italic ' + fontSize + 'px "Noto Serif Tamil","Latha",Georgia,serif';
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  
  for (let i = 0; i < words.length; i++) {
    const test = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur !== '') { 
      lines.push(cur); 
      cur = words[i]; 
    } else { 
      cur = test; 
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function downloadQuoteImage() {
  if (!currentQuoteData) return;
  const canvas = document.getElementById('quoteCanvas');
  const a = document.createElement('a');
  a.download = 'quote_' + (currentQuoteData.character || 'quote').replace(/\s+/g, '_') + '.png';
  a.href = canvas.toDataURL('image/png'); 
  a.click();
}

// ── UTILITY: SHOW / HIDE SYSTEMS ─────────────────────────────────────────────
function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
  document.getElementById('rightDrawer').classList.remove('open');
}

function toggleRightDrawer() {
  document.getElementById('rightDrawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
  document.getElementById('drawer').classList.remove('open');
}

function closeAllDrawers() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('rightDrawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function toggleTheme() {
  isNight = !isNight;
  document.body.classList.toggle('night', isNight);
  document.getElementById('themeIcon').textContent = isNight ? '☀️' : '🌙';
  document.getElementById('themeLabel').textContent = isNight ? 'Light' : 'Night';
}

function updateFloatBtns() {
  const onCh = currentView === 'chapter';
  const floatPrev = document.getElementById('floatPrev');
  const floatNext = document.getElementById('floatNext');
  if (floatPrev) floatPrev.disabled = !onCh || flatIndex === 0 || flatChapters.length === 0;
  if (floatNext) floatNext.disabled = !onCh || flatIndex === flatChapters.length - 1 || flatChapters.length === 0;
}

// ── SECTION COLLAPSE PANEL ───────────────────────────────────────────────────
function openSectionsPanel() {
  let html = '';
  sectionDefs.forEach(s => {
    html += `<button class="sp-toggle${!sectionVisibility[s.id] ? ' hidden' : ''}" onclick="toggleSection('${s.id}')">${s.label}</button>`;
  });
  document.getElementById('spToggles').innerHTML = html;
  document.getElementById('sectionsPanel').classList.add('open');
  document.getElementById('spOverlay').classList.add('open');
}

function closeSectionsPanel() {
  document.getElementById('sectionsPanel').classList.remove('open');
  document.getElementById('spOverlay').classList.remove('open');
}

function toggleSection(id) {
  sectionVisibility[id] = !sectionVisibility[id];
  const btns = document.querySelectorAll('#spToggles .sp-toggle');
  sectionDefs.forEach((s, idx) => { 
    if (s.id === id && btns[idx]) btns[idx].classList.toggle('hidden', !sectionVisibility[id]); 
  });
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden-section', !sectionVisibility[id]);
}
